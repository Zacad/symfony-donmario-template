services:
  app:
    image: ${RUNTIME_IMAGE:-donmario-dev:local}
    init: true
    # libpq's connection timeout does not cover libc DNS resolution. A stopped
    # Compose service disappears from Docker DNS; bound resolver retries too.
    dns_opt: ['timeout:1', 'attempts:1']
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-}
      APP_INSTANCE_ID: ${PROJECT_ID:-local}
      EVENT_TRANSPORT_DSN: ${EVENT_TRANSPORT_DSN:-sync://}
      DATABASE_URL: postgresql://app:${APP_DATABASE_PASSWORD:-}@database:5432/${APP_DATABASE_NAME:-app}?serverVersion=18&charset=utf8
      DEFAULT_URI: http://localhost:${APP_PORT:-8080}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - .:/app:z
      # Also masks host var/docker/local.env from app and console containers.
      - runtime:/app/var
      - jwt_keys:/app/var/jwt:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--max-time', '4', 'http://localhost:8080/health/ready']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    profiles: [worker]
    image: ${RUNTIME_IMAGE:-donmario-dev:local}
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    dns_opt: ['timeout:1', 'attempts:1']
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-}
      APP_INSTANCE_ID: ${PROJECT_ID:-local}
      EVENT_TRANSPORT_DSN: ${EVENT_TRANSPORT_DSN:-sync://}
      DATABASE_URL: postgresql://app:${APP_DATABASE_PASSWORD:-}@database:5432/${APP_DATABASE_NAME:-app}?serverVersion=18&charset=utf8
      DEFAULT_URI: http://localhost:${APP_PORT:-8080}
    command: ['php', 'bin/console', 'messenger:consume', 'events', '--time-limit=3600', '--memory-limit=128M', '--limit=1000', '--sleep=1', '--no-interaction']
    volumes:
      - .:/app:z
      - worker_runtime:/app/var
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  database:
    image: ${DATABASE_IMAGE:-donmario-database:local}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-}
      APP_DATABASE_NAME: ${APP_DATABASE_NAME:-app}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      # The init server uses a Unix socket; TCP waits until all init hooks finish.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

volumes:
  jwt_keys:
    labels:
      com.donmario.checkout: ${CHECKOUT_ID:-unknown}
      com.donmario.environment: ${APP_MODE:-dev}
  worker_runtime:
    labels:
      com.donmario.checkout: ${CHECKOUT_ID:-unknown}
      com.donmario.environment: ${APP_MODE:-dev}
  runtime:
    labels:
      com.donmario.checkout: ${CHECKOUT_ID:-unknown}
      com.donmario.environment: ${APP_MODE:-dev}
  database:
    labels:
      com.donmario.checkout: ${CHECKOUT_ID:-unknown}
      com.donmario.environment: ${APP_MODE:-dev}
