doctrine:
    dbal:
        default_connection: default
        connections:
            default: &database
                url: '%env(DATABASE_URL)%'
                driver: pdo_pgsql
                server_version: '18'
                options:
                    !php/const PDO::ATTR_TIMEOUT: 2
            # A separate short-lived connection keeps probe limits out of use cases/migrations.
            readiness:
                <<: *database
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                auto_mapping: false
                mappings:
                    TaskTracking:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Module/TaskTracking/Domain'
                        prefix: 'App\Module\TaskTracking\Domain'
