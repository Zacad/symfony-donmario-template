services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    app.command_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: command
    app.query_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: query
    app.command_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [command, []]
    app.query_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [query, []]

    App\Platform\Messaging\ApplicationEventRecorder:
        # CqrsPass supplies the concrete public Application-event inventory.
        arguments: ['@App\Platform\Messaging\InvocationContext', []]

    App\Platform\Messaging\EventDeliveryContext: ~

    App\Platform\Messaging\BestEffortEventDispatcher:
        arguments:
            $context: '@App\Platform\Messaging\EventDeliveryContext'
            $bus: '@application.event.bus'
            $logger: '@logger'

    App\Platform\Messaging\EventPolicyMiddleware:
        arguments:
            - '@App\Platform\Messaging\EventDeliveryContext'
            - '@App\Platform\Messaging\InvocationContext'
            - []
