imports:
    - { resource: messaging_diagnostics.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    app.command_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: command
    app.query_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: query
    app.command_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [command, []]
    app.query_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [query, []]

    App\Platform\Messaging\EventPolicyMiddleware:
        # CqrsPass supplies the concrete public Application-event inventory.
        arguments: [[], '@App\Platform\Authorization\ExecutionContext']

    App\Platform\Authorization\AuthorizationMiddleware:
        arguments:
            $decisions: '@app.authorization.decision_manager'
            $routes: []

    App\Platform\Authorization\PublicAccessVoter:
        autowire: true
        autoconfigure: false
        lazy: true
        arguments:
            $messages: []
        tags:
            - { name: app.authorization.voter }

    app.authorization.unanimous_strategy:
        class: Symfony\Component\Security\Core\Authorization\Strategy\UnanimousStrategy
        arguments: [false]

    app.authorization.decision_manager:
        class: Symfony\Component\Security\Core\Authorization\AccessDecisionManager
        arguments:
            $voters: !tagged_iterator app.authorization.voter
            $strategy: '@app.authorization.unanimous_strategy'

    App\Platform\Authorization\ExecutionContext:
        arguments:
            $trust: '@security.authentication.trust_resolver'
