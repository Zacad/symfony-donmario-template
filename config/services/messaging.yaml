imports:
    - { resource: messaging_diagnostics.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    app.command_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: command
    app.query_scope:
        class: App\Platform\Messaging\InvocationMiddleware
        arguments:
            $kind: query
    app.command_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [command, []]
    app.query_policy:
        class: App\Platform\Messaging\MessagePolicyMiddleware
        arguments: [query, []]

    App\Platform\Messaging\EventPolicyMiddleware:
        # CqrsPass supplies the concrete public Application-event inventory.
        arguments: [[]]
